name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: make test

  build-amd64:
    name: Build AMD64 binaries and image
    needs: test
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go for native binaries
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Select native Linux and cross-compiled Windows targets
        env:
          RELEASE_ARCH: amd64
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          bash scripts/release-config.sh "$RELEASE_ARCH" "$RUNNER_TEMP/goreleaser.yml"
          printf 'Dance %s: Linux %s native; Windows %s cross-compiled on Linux.\n' \
            "$RELEASE_TAG" "$RELEASE_ARCH" "$RELEASE_ARCH" > "$RUNNER_TEMP/binary-release-notes.md"

      - name: Package native Linux and cross-compiled Windows binaries
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean --parallelism 1 --skip=publish,announce --config ${{ runner.temp }}/goreleaser.yml --release-notes ${{ runner.temp }}/binary-release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Retain binary archives for publication
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dance-binaries-amd64
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push AMD64
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

      - name: Smoke test
        run: |
          trap 'docker logs smoke-amd64 2>/dev/null || true; docker rm -f smoke-amd64 >/dev/null 2>&1 || true' EXIT
          docker pull --platform linux/amd64 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          docker run --rm -d --name smoke-amd64 \
            -e DANCE_ADDR=:8088 \
            -e DANCE_ADMIN_EMAIL=test@test \
            -e DANCE_ADMIN_PASSWORD=test \
            -e DANCE_SESSION_KEY="$(openssl rand -hex 32)" \
            -e DANCE_STEPCA_URL=https://ca.example \
            -p 18088:8088 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          curl --retry 30 --retry-all-errors --retry-connrefused --retry-delay 1 --max-time 5 -fsS http://localhost:18088/healthz
          curl --max-time 5 -fsS http://localhost:18088/login | grep -q "Sign in to dance"

  build-arm64:
    name: Build ARM64 binaries and image
    needs: test
    runs-on: ubuntu-24.04-arm
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go for native binaries
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Select native Linux and cross-compiled Windows targets
        env:
          RELEASE_ARCH: arm64
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          bash scripts/release-config.sh "$RELEASE_ARCH" "$RUNNER_TEMP/goreleaser.yml"
          printf 'Dance %s: Linux %s native; Windows %s cross-compiled on Linux.\n' \
            "$RELEASE_TAG" "$RELEASE_ARCH" "$RELEASE_ARCH" > "$RUNNER_TEMP/binary-release-notes.md"

      - name: Package native Linux and cross-compiled Windows binaries
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean --parallelism 1 --skip=publish,announce --config ${{ runner.temp }}/goreleaser.yml --release-notes ${{ runner.temp }}/binary-release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Retain binary archives for publication
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dance-binaries-arm64
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ARM64
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

      - name: Smoke test
        run: |
          trap 'docker logs smoke-arm64 2>/dev/null || true; docker rm -f smoke-arm64 >/dev/null 2>&1 || true' EXIT
          docker pull --platform linux/arm64 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          docker run --rm -d --name smoke-arm64 \
            -e DANCE_ADDR=:8088 \
            -e DANCE_ADMIN_EMAIL=test@test \
            -e DANCE_ADMIN_PASSWORD=test \
            -e DANCE_SESSION_KEY="$(openssl rand -hex 32)" \
            -e DANCE_STEPCA_URL=https://ca.example \
            -p 18088:8088 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          curl --retry 30 --retry-all-errors --retry-connrefused --retry-delay 1 --max-time 5 -fsS http://localhost:18088/healthz
          curl --max-time 5 -fsS http://localhost:18088/login | grep -q "Sign in to dance"

  merge:
    name: Create multi-arch manifest
    runs-on: ubuntu-latest
    needs: [build-amd64, build-arm64]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-amd64.outputs.digest }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-arm64.outputs.digest }}

      - name: Update latest for stable releases
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          docker buildx imagetools create -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}

      - name: Inspect
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}

  release:
    name: Create GitHub release
    runs-on: ubuntu-24.04
    needs: [test, merge]
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v5

      - name: Download native-runner binary archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dance-binaries-*
          merge-multiple: true
          path: dist

      - name: Verify archives and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 4
          for arch in amd64 arm64; do
            test -s "dist/dance_${RELEASE_TAG#v}_linux_${arch}.tar.gz"
            test -s "dist/dance_${RELEASE_TAG#v}_windows_${arch}.zip"
          done
          (cd dist && sha256sum -- *.tar.gz *.zip > checksums.txt)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/*.zip dist/checksums.txt --clobber
          else
            flags=(--verify-tag --title "Dance $RELEASE_TAG")
            if [[ "$RELEASE_TAG" == *-* ]]; then
              flags+=(--prerelease --latest=false)
            else
              flags+=(--latest)
            fi
            notes="docs/releases/$RELEASE_TAG.md"
            if [[ -f "$notes" ]]; then
              flags+=(--notes-file "$notes")
            else
              flags+=(--generate-notes)
            fi
            gh release create "$RELEASE_TAG" dist/*.tar.gz dist/*.zip dist/checksums.txt "${flags[@]}"
          fi
